[project]
name = "quantedge-live-gateway"
version = "0.1.0"
description = "QuantEdge Live Market Gateway - secure live market intelligence backend exposing MCP and HTTP transports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "mcp>=1.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "anthropic>=0.40.0",
]


[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
    "pandas-stubs>=2.2.0",
    "respx>=0.21.1",
]

[project.scripts]
quantedge-mcp = "quantedge.mcp_server.__main__:main"
quantedge-api = "quantedge.api.__main__:main"
quantedge-worker = "quantedge.workers.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantedge"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "ASYNC",# flake8-async
    "S",    # bandit security
    "DTZ",  # flake8-datetimez -- enforces timezone-aware datetimes
    "BLE",  # blind except -- swallowing errors is how fabricated data gets in
    "SLF",  # private member access across module boundaries
    "PL",   # pylint
    "SIM",  # flake8-simplify
    "RUF",
]
ignore = [
    "S101",  # assert is fine in tests and internal invariants
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "RUF012",# mutable class attrs without ClassVar
    # HTTP status codes, epoch-second constants and field-count checks read
    # better as literals than as named constants; naming `200` adds a lookup
    # without adding meaning. Kept off globally rather than suppressed ~30 times.
    "PLR2004",
    # Complexity metrics. The long functions here are flat validation and
    # normalization sequences -- splitting them to satisfy a statement count
    # would scatter one linear check across several call frames.
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"src/quantedge/providers/llm/*" = ["S105"]
# The registry imports each adapter inside its own match arm on purpose: that
# is what stops one broken or unavailable vendor from failing the import of the
# whole routing layer. See ProviderRegistry._build.
"src/quantedge/providers/registry.py" = ["PLC0415"]
# The repository factory imports SQLAlchemy inside the try block on purpose: the
# in-memory fallback has to survive a failed database import, not just a failed
# connection, so the factory must not hard-require SQLAlchemy at module scope.
# memory.py borrows _window_start from sql.py the same way. See get_repository.
"src/quantedge/repositories/__init__.py" = ["PLC0415"]
"src/quantedge/repositories/memory.py" = ["PLC0415"]
# The chat/signal/scanner trio import each other inside functions to break a
# genuine cycle: chat calls signal, signal calls scanner, and both reach back
# into memory for past outcomes. Hoisting any of these to module scope makes
# the package unimportable. The LLM adapters do the same for their optional
# transport so a missing client library disables one provider rather than the
# whole registry.
"src/quantedge/services/signal.py" = ["PLC0415"]
"src/quantedge/services/scanner.py" = ["PLC0415"]
"src/quantedge/api/routes.py" = ["PLC0415"]
"src/quantedge/providers/llm/*.py" = ["PLC0415", "S105"]
# Diagnostic smoke scripts: they deliberately probe private helpers to prove a
# parser rejects bad input, and they catch broadly so one failed section still
# reports the rest. They are operator tools, not shipped library code.
"scripts/**" = ["BLE001", "SLF001", "S105", "S311", "T201", "PLC0415"]
# A background worker loop must survive anything one iteration throws, including
# a provider client raising something outside our hierarchy. Narrowing this to
# QuantEdgeError would let an unexpected exception kill a daemon that is supposed
# to keep running; the exception is logged, not swallowed silently. Each site
# carries its own `noqa` rather than a blanket ignore here, so a blind except
# added to worker code for some *other* reason still has to justify itself.
# Console entrypoints defer their heavy imports into main() so `--help` and an
# import-time config error do not first drag in uvicorn, SQLAlchemy and the
# whole provider stack.
"src/quantedge/**/__main__.py" = ["PLC0415"]
# The log formatter is the one place that cannot raise: record.getMessage() fails
# on a bad format string, and letting that propagate would lose the log line that
# was being written to report some other problem.
"src/quantedge/logging.py" = ["BLE001"]
# Intent is `str, Enum` rather than StrEnum because it is matched against raw
# request strings and serialised into JSON responses; UP042's suggested StrEnum
# is 3.11+ only and target-version here is py311, so the rewrite buys nothing.
"src/quantedge/services/chat.py" = ["PLC0415", "UP042"]
# Analysis builders assembling one dataclass from many independently-computed
# indicator values. Every argument is passed by keyword at the call sites; the
# count reflects how many indicators a report carries, not an unclear signature.
"src/quantedge/services/mtf.py" = ["PLC0415", "PLR0917"]
"src/quantedge/services/risk.py" = ["PLR0917"]
"src/quantedge/services/structure.py" = ["PLR0917"]

[tool.ruff.lint.isort]
known-first-party = ["quantedge"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["quantedge"]
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*"]
disallow_untyped_defs = false
ignore_errors = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "unit: deterministic tests with no external I/O",
    "contract: provider payload normalization against recorded fixtures",
    "integration: in-process wiring across components (no third-party network)",
    "live: hits real external networks; excluded from default runs",
    "adversarial: malformed, hostile or degraded input handling",
]
filterwarnings = ["ignore::DeprecationWarning"]
